name: PR Build & Version
on:
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version in pyproject.toml
        if: github.event.pull_request.title != ''
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          VERSION_FILE=src/pyproject.toml
          CURRENT_VERSION=$(grep '^version =' $VERSION_FILE | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          if [[ "$PR_TITLE" =~ ^BREAKING-CHANGE ]]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif [[ "$PR_TITLE" =~ ^FEATURE ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
          elif [[ "$PR_TITLE" =~ ^PATCH ]]; then
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          sed -i "s/version = \".*\"/version = \"$NEW_VERSION\"/" $VERSION_FILE
          echo "Updated version to $NEW_VERSION in $VERSION_FILE"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements.txt
          pip install -e src

      - name: Lint with pylint
        run: |
          pylint src/
        continue-on-error: false

      - name: Run tests
        run: |
          pytest
        continue-on-error: false

      - name: Build package
        run: |
          python -m build ./src
        continue-on-error: false
