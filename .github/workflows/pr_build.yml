name: PR Build & Version
on:
  pull_request:
    branches: ['main']
    types: [closed]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update Package version
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          WRITE_VERSION: true
        run: |
          python ./.github/workflows/scripts/update_version.py
        continue-on-error: false

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add src/pyproject.toml
          git diff --staged --quiet && echo "No version change, skipping commit" || git commit -m "CHORE: bump version ${{ steps.bump.outputs.version_summary }} [skip ci]" && git push
        continue-on-error: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e src

      - name: Lint with pylint
        run: |
          pylint src/
        continue-on-error: false

      - name: Run tests
        run: |
          pytest
        continue-on-error: false

      - name: Build package
        run: |
          python -m build ./src
        continue-on-error: false

      - name: Final Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add src/pyproject.toml
          git diff --staged --quiet && echo "Nothing to commit, skipping commit" || git commit -m "CHORE: merge into main build [skip ci]" && git push
        continue-on-error: false
