[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowstream-cli"
version = "0.1.0a"
description = "Snowstream CLI Library"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name="Anton Stechman", email="stechman.ab@gmail.com" }
]
dependencies = [
    "snowflake-cli-labs==3.15.0"
    , "snowflake-snowpark-python==1.41.0"
    , "keyring==25.7.0"
]

[project.scripts]
snowstream = "snowstream_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snowstream_cli*"]
