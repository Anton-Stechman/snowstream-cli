[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowstream-cli"
version = "0.2.0"
description = "Snowstream CLI Library"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
authors = [
  {name = "Anton Stechman", email = "stechman.ab@gmail.com"}
]
dependencies = [
    "snowflake-cli>=3.15.0"
    , "snowflake-snowpark-python>=1.41.0"
    , "snowflake-connector-python>=3.18.0"
    , "keyring>=25.7.0"
    , "PyYAML>=6.0.2"
    , "toml>=0.10.2"
    , "cryptography>=43.0.1"
    , "asn1crypto>=1.5.1"
    , "streamlit>=1.46.0"
    , "packaging>=25.0"
    , "pylint>=4.0.2"
    , "mypy>=1.16.0"
    , "pytest>=9.0.2"
    , "colorama>=0.4.6"
]

[tool.setuptools.package-data]
snowstream = ["templates/structure.yml", "templates/files/**", "data/**"]

[project.scripts]
snowstream = "snowstream_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snowstream_cli*"]
