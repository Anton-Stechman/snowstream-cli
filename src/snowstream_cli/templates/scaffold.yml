root:
  files:
    - name: .gitignore
      type: text
      template: gitignore.template
      git-ignore: false
  folders:
    - name: .locals
      git-ignore: true
      files:
        - name: profile
          type: yaml
          template: profile.template
          git-ignore: false
        - name: .gitkeep
          type: text
          template: gitkeep.template
          git-ignore: false
      folders: null
    - name: .manifest
      git-ignore: true
      files:
        - name: .gitkeep
          type: text
          template: gitkeep.template
          git-ignore: false
      folders: null
    - name: snowstream
      main: true
      files:
        - name: project
          type: yaml
          template: project.template
          main: true
        - name: .gitkeep
          type: text
          template: gitkeep.template
          git-ignore: false
          git-ignore: false
      folders:
        - name: apps
          apps-dir: true
          git-ignore: false
          files:
          - name: .gitkeep
            type: text
            template: gitkeep.template
            git-ignore: false
          folders: null
      git-ignore: false
