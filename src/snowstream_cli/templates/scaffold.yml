root:
  files:
    - name: .gitignore
      type: text
      template: gitignore.template
      git-ignore: false
  folders:
    - name: .locals
      git-ignore: true
      files:
        - name: profile
          type: yaml
          template: profile.template
          git-ignore: false
      folders: null
    - name: .manifest
      git-ignore: true
      files: null
      folders: null
    - name: snowstream
      files:
        - name: project
          type: yaml
          template: project.template
          git-ignore: false
      folders:
        - name: apps
          git-ignore: false
          files: null
          folders: null
      git-ignore: false
